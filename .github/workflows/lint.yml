name: UniTik Zero-Trust CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  php-lint:
    name: PHP 8.2 Syntax & Security Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring

      - name: Lint Root Auth Endpoints
        run: |
          for file in backend/*.php; do
            php -l "$file"
          done

      - name: Lint Modular Backend Directories
        run: |
          find backend/core backend/events backend/tickets backend/applications backend/admin -type f -name "*.php" -print0 | xargs -0 -n1 php -l

  nextjs-check:
    name: Next.js Type & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit